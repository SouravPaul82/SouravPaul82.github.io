name: CI/CD Website Deployment

on:
  push:
    branches:
      - main # Triggers the pipeline only on pushes to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Pull the latest code down into the GitHub runner workspace
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Authenticate securely with AWS using your repo secrets
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Step 3: Synchronize folder structures seamlessly to S3
    - name: Deploy Frontend Files to S3
      run: |
        aws s3 sync ./frontend s3://${{ secrets.S3_BUCKET_NAME }} --delete